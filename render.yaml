services:
  - type: web
    name: ragify
    runtime: python
    buildCommand: apt-get update && apt-get install -y ffmpeg && pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address=0.0.0.0 --server.port=$PORT
    envVars:
      - key: WHISPER_MODEL
        value: tiny
      - key: MISTRAL_API_KEY
        sync: false
